apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1-deployment
  labels:
    app: app1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
      - name: app1-container
        image: docker.io/istio/examples-bookinfo-productpage-v1:1.16.2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9080
---
apiVersion: v1
kind: Service
metadata:
  name: app1-svc
spec:
  type: NodePort
  selector:
    app: app1
  ports:
  - name: http
    port: 8090        # Port inside the cluster network
    targetPort: 9080 # Matches containerPort in Deployment
    nodePort: 32001   # External port on cluster nodes