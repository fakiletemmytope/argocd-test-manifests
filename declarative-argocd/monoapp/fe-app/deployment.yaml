apiVersion: apps/v1
kind: Deployment
metadata:
  name: fe-app
spec:
  selector:
    matchLabels:
      app: fe-app
  replicas: 1
  template:
    metadata:
      labels:
        app: fe-app
    spec:
      containers:
      - name: geocentric-model
        image: docker.io/temmytope/kc-capstone-fe:latest
        ports:
        - containerPort: 80
