apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.details.service.name}}
  labels:
    {{- range $key, $value:= .Values.details.service.labels }}
    {{ $key}}: {{ $value }}
    {{- end }}
spec:
  ports:
  {{- range .Values.details.service.ports }}
  - name: {{ .name }}
    port: {{ .port }}
  {{- end }}
  selector:
    {{- range $key, $value:= .Values.details.service.selector }}
    {{ $key}}: {{ $value }}
    {{- end }}

    
