apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.reviews.service.name }}
  labels:
    {{- range $key, $value:= .Values.reviews.service.labels }}
    {{ $key }}: {{ $value }}
    {{- end }}
spec:
  ports:
  {{- range .Values.reviews.service.ports}}
  - name: {{ .name }}
    port: {{ .port }}
    protocol: {{ .protocol }}
  {{- end }}
  selector:
    {{- range $key, $value:= .Values.reviews.service.selector }}
    {{ $key }}: {{ $value }}
    {{- end }}